name: Build
on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag (e.g. v4.3.1). Leave empty to build only."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - name: Setup .NET 9
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with: { dotnet-version: '9.0.x' }
      - name: Install MAUI
        run: dotnet workload install maui
      - name: Setup Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: '21' }
      - name: Publish APK
        run: dotnet publish Jamrah.csproj -f net9.0-android -c Release
      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jamrah-apk
          path: bin/Release/**/publish/*.apk

  build-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - name: Setup .NET 9
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with: { dotnet-version: '9.0.x' }
      - name: Install MAUI
        run: dotnet workload install maui
      - name: Publish EXE
        run: dotnet publish Jamrah.csproj -f net9.0-windows10.0.19041.0 -c Release -p:WindowsPackageType=None
      - name: Upload EXE
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jamrah-exe
          path: bin/Release/**/publish/*.exe

  release:
    needs: [build-apk, build-exe]
    runs-on: windows-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.version != ''
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - name: Download APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: jamrah-apk
          path: ./artifacts/apk
      - name: Download EXE
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: jamrah-exe
          path: ./artifacts/exe
      - name: List artifacts (debug)
        run: Get-ChildItem -Path ./artifacts -Recurse | Format-Table -AutoSize
      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: "Jamrah ${{ github.event.inputs.version }}"
          body: "Built from ${{ github.sha }}"
          draft: false
          prerelease: false
          files: |
            ./artifacts/apk/**/*.apk
            ./artifacts/exe/**/*.exe
            ./artifacts/**/*.apk
            ./artifacts/**/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
