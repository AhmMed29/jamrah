<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Athenaeum — your personal library</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root{
            --bg:#f7f6f3; --surface:#fff; --ink:#181715; --ink2:#59554e; --ink3:#a5a199;
            --line:#e9e6e0; --line2:#d8d4cb; --hover:#f1efe9;
            --fav:#d97706; --danger:#b91c1c;
            --sans:'Tajawal','Segoe UI',system-ui,sans-serif; --mono:'JetBrains Mono',monospace;
        }
        *{margin:0;padding:0;box-sizing:border-box}
        [hidden]{display:none!important}
        ::selection{background:var(--ink);color:#fff}
        html,body{height:100%}
        body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased;overflow:hidden}
        button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
        input,select,textarea{font:inherit;color:var(--ink)}
        svg{flex:none;vertical-align:-3px}
        ::-webkit-scrollbar{width:9px;height:9px}
        ::-webkit-scrollbar-thumb{background:#d8d4cc;border-radius:5px;border:2px solid var(--bg)}
        ::-webkit-scrollbar-track{background:transparent}
        .mono{font-family:var(--mono)}
        kbd{font-family:var(--mono);font-size:10.5px;font-weight:600;border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;padding:1px 6px;background:var(--surface);color:var(--ink2)}
        #app{display:grid;grid-template-columns:250px 1fr;height:100vh;transition:grid-template-columns .22s ease}
        #app.slim{grid-template-columns:0 1fr}
        #frame{display:flex;flex-direction:column;min-width:0;height:100vh;overflow:hidden}
        #main{flex:1 1 0;min-height:0;overflow-y:auto;overflow-x:hidden;padding:26px 34px 90px}
        #sb{overflow-y:auto;overflow-x:hidden;border-right:1px solid var(--line);background:var(--bg);white-space:nowrap;height:100vh;transition:opacity .18s}
        #app.slim #sb{opacity:0;pointer-events:none}
        .page{animation:pgin .25s ease both}
        @keyframes pgin{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
        .sb-brand{display:flex;align-items:center;gap:10px;padding:18px 16px 12px}
        .sb-mark{width:25px;height:25px;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px;border-radius:7px;flex:none}
        .sb-name{font-weight:800;font-size:17px}
        .sb-coll{width:26px;height:26px;margin-left:auto;display:grid;place-items:center;border-radius:6px;color:var(--ink3)}
        .sb-coll:hover{background:var(--hover);color:var(--ink)}
        .sb-sec{display:flex;align-items:center;gap:6px;padding:15px 17px 5px;font-size:10.5px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3);cursor:pointer;user-select:none}
        .sb-sec:hover{color:var(--ink)}
        .sb-sec .chev{margin-left:auto;display:grid;place-items:center;transition:transform .18s}
        .sb-sec.closed .chev{transform:rotate(-90deg)}
        .sb-i{display:flex;align-items:center;gap:9px;padding:6px 10px;margin:1px 8px;border-radius:8px;color:var(--ink2);cursor:pointer;font-weight:500;font-size:13.5px;user-select:none}
        .sb-i:hover{background:var(--hover);color:var(--ink)}
        .sb-i.on{background:var(--ink);color:#fff}
        .sb-i .n{overflow:hidden;text-overflow:ellipsis}
        .sb-i .c{margin-left:auto;font-size:11px;color:var(--ink3);font-weight:700}
        .sb-i.on .c{color:#ffffff99}
        .sb-i .dots{margin-left:auto;opacity:0;color:var(--ink3);display:grid;place-items:center;width:20px;height:20px;border-radius:5px;flex:none}
        .sb-i .dots:hover{background:var(--line2);color:var(--ink)}
        .sb-i:hover .dots{opacity:1}
        .sb-i.has-dots:hover .c{display:none}
        .sb-i .chev{width:17px;height:17px;flex:none;display:grid;place-items:center;color:var(--ink3);transition:transform .18s;border-radius:4px}
        .sb-folder.closed>.chev{transform:rotate(-90deg)}
        .sb-sub{margin-left:15px;border-left:1px solid var(--line);padding-left:2px}
        .sb-add{display:flex;align-items:center;gap:8px;padding:5px 10px;margin:2px 8px;border-radius:8px;color:var(--ink3);font-size:12.5px;font-weight:500;cursor:pointer}
        .sb-add:hover{color:var(--ink);background:var(--hover)}
        .sb-foot{padding:16px;font-size:11.5px;color:var(--ink3);border-top:1px solid var(--line);margin-top:14px;white-space:normal}
        .sb-emoji{font-size:15px;line-height:1;flex:none;width:16px;text-align:center}
        #top{height:56px;display:flex;align-items:center;gap:12px;padding:0 22px;border-bottom:1px solid var(--line);background:rgba(247,246,243,.88);backdrop-filter:blur(6px);flex:none}
        .qwrap{flex:1;max-width:560px;margin:0 auto;display:flex;position:relative}
        .qwrap .sic{position:absolute;left:11px;top:10px;color:var(--ink3);pointer-events:none}
        #q{flex:1;height:36px;border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:0 32px 0 35px;outline:none;transition:border-color .15s}
        #q:focus{border-color:var(--ink)}
        .qclr{position:absolute;right:9px;top:9px;width:18px;height:18px;display:grid;place-items:center;color:var(--ink3);border-radius:5px}
        .qclr:hover{color:var(--ink);background:var(--hover)}
        .top-r{margin-left:auto;display:flex;gap:8px;align-items:center}
        .btn{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 14px;border:1px solid var(--line2);border-radius:8px;background:var(--surface);font-weight:500;font-size:13px;transition:.15s}
        .btn:hover{background:var(--hover);border-color:#c7c3ba}
        .btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
        .btn.pri:hover{background:#000}
        .btn.sm{height:28px;padding:0 10px;font-size:12px}
        .btn.dgr{color:var(--danger);border-color:#ecc8c4}
        .btn.dgr:hover{background:#fdf1ef}
        .ibtn{width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--line);border-radius:8px;color:var(--ink2);transition:.15s}
        .ibtn:hover{background:var(--surface);border-color:var(--line2);color:var(--ink)}
        .ph-row{display:flex;align-items:baseline;gap:14px;margin-bottom:16px;flex-wrap:wrap}
        .ph-title{font-size:25px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
        .ph-sub{font-size:12.5px;color:var(--ink3);font-weight:500}
        .crumbs{display:flex;gap:7px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--ink3);font-weight:600;margin-bottom:12px}
        .crumb{cursor:pointer;display:inline-flex;align-items:center;gap:7px}
        .crumb:hover{color:var(--ink)}
        .crumb.end{color:var(--ink);font-weight:700;cursor:default}
        .res-head{display:flex;align-items:center;gap:12px;margin-bottom:16px;font-size:13px;color:var(--ink2)}
        .res-head b{color:var(--ink)}
        .toolbar{display:flex;align-items:center;gap:8px;padding-bottom:13px;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap}
        .seg{display:flex;border:1px solid var(--line2);border-radius:8px;background:var(--surface);overflow:hidden}
        .seg button{width:33px;height:31px;display:grid;place-items:center;color:var(--ink3);border-right:1px solid var(--line)}
        .seg button:last-child{border-right:0}
        .seg button:hover{color:var(--ink);background:var(--hover)}
        .seg button.on{background:var(--ink);color:#fff}
        .tbtn{display:inline-flex;align-items:center;gap:7px;height:33px;padding:0 11px;border:1px solid var(--line2);border-radius:8px;background:var(--surface);font-size:12.5px;font-weight:500;color:var(--ink2)}
        .tbtn:hover{color:var(--ink);background:var(--hover)}
        .tbtn b{color:var(--ink);font-weight:700}
        .tbtn.act{border-color:var(--ink);color:var(--ink)}
        .fchips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
        .fchip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--ink);color:#fff}
        .fchip button{color:#ffffffaa;font-weight:800}.fchip button:hover{color:#fff}
        .v-list{display:flex;flex-direction:column;gap:10px}
        .v-masonry{column-gap:16px;columns:240px}
        .v-masonry .card{margin-bottom:16px;break-inside:avoid}
        .hrow{display:flex;gap:16px;overflow-x:auto;padding:4px 2px 12px;scrollbar-width:thin}
        .hrow .card{width:248px;flex:none}
        .hrow.wide .card{width:312px}
        .card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:10px;cursor:pointer;transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease;overflow:hidden}
        .card:hover{transform:translateY(-2px);border-color:var(--line2);box-shadow:0 1px 2px rgba(24,23,21,.04),0 10px 26px rgba(24,23,21,.07)}
        .card[data-static]{cursor:default}
        .card[data-static]:hover{transform:none;box-shadow:none;border-color:var(--line)}
        .favb{position:absolute;top:9px;right:9px;width:26px;height:26px;display:grid;place-items:center;border-radius:7px;color:var(--ink3);opacity:0;transition:.15s;z-index:3}
        .card:hover .favb{opacity:1}
        .favb.on{opacity:1;color:var(--fav)}
        .favb:hover{background:rgba(24,23,21,.1)}
        .favb.lt{color:#fff;filter:drop-shadow(0 1px 3px rgba(0,0,0,.55))}
        .favb.lt:hover{background:rgba(255,255,255,.22)}
        .bar{height:4px;background:#ecebe6;border-radius:99px;overflow:hidden}
        .bar i{display:block;height:100%;background:var(--ink);border-radius:99px}
        .bar.w120{width:120px}
        .st{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--ink2)}
        .st::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--c,#a5a199)}
        .chip{display:inline-flex;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;background:#efece6;color:var(--ink2);cursor:pointer}
        .chip.x{gap:5px}.chip.x:hover{background:var(--line)}
        .chip.x::after{content:'×';font-weight:800}
        .tags{display:flex;gap:5px;flex-wrap:wrap}
        .rt{font-weight:800}
        .mn{padding:15px 16px}
        .mn-t{font-weight:700;font-size:14.5px;line-height:1.3}
        .mn-d{font-size:12.5px;color:var(--ink2);line-height:1.5;margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
        .mn .tags{margin-top:10px}
        .mi-i{aspect-ratio:16/10;background:#e9e7e1;overflow:hidden}
        .mi-i img{width:100%;height:100%;object-fit:cover;display:block}
        .mi-b{padding:12px 14px 14px}
        .mi-t{font-weight:700;font-size:14px}
        .mi-m{font-size:12px;color:var(--ink3);font-weight:500;margin-top:3px}
        .mi-b .tags{margin-top:9px}
        .pp-img{aspect-ratio:2/3;background:var(--ink);position:relative;overflow:hidden}
        .pp-img img{width:100%;height:100%;object-fit:cover;display:block}
        .pp-typo{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:15px 14px;color:#fff}
        .pp-typo span{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#ffffff88;font-weight:700}
        .pp-typo strong{font-weight:800;font-size:clamp(16px,3vw,22px);line-height:1.08}
        .pp-b{padding:11px 12px 13px}
        .pp-t{font-weight:700;font-size:13.5px;line-height:1.3}
        .pp-m{font-size:11.5px;color:var(--ink3);font-weight:700;margin-top:4px;display:flex;gap:8px}
        .pp-m .rt{color:var(--ink)}
        .cn{position:relative;aspect-ratio:21/9;min-height:170px;background:var(--ink);color:#fff;overflow:hidden}
        .cn.imghero{aspect-ratio:4/3}
        .cn img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
        .cn-ov{position:absolute;inset:auto 0 0 0;padding:38px 16px 13px;background:linear-gradient(to top,rgba(10,10,9,.72),rgba(10,10,9,0))}
        .cn-t{font-weight:800;font-size:19px;line-height:1.12}
        .cn-m{font-size:11.5px;color:#ffffffcc;font-weight:500;margin-top:4px}
        .cn-fb{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:0 20px}
        .cn-fb span{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#ffffff77;font-weight:700}
        .cn-fb strong{font-weight:800;font-size:23px;line-height:1.05;margin-top:6px}
        .ls-im{aspect-ratio:16/9;background:#e9e7e1;position:relative;overflow:hidden}
        .ls-im img{width:100%;height:100%;object-fit:cover;display:block}
        .ls-d{position:absolute;bottom:8px;right:8px;background:rgba(16,15,13,.85);color:#fff;font-size:10.5px;font-weight:700;font-family:var(--mono);padding:2px 7px;border-radius:5px}
        .ls-b{padding:11px 13px 13px}
        .ls-t{font-weight:700;font-size:13.5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
        .ls-m{font-size:11.5px;color:var(--ink3);font-weight:500;margin-top:3px}
        .tg-i{aspect-ratio:1;background:#e9e7e1;overflow:hidden}
        .tg-i img{width:100%;height:100%;object-fit:cover;display:block}
        .tg-t{padding:8px 10px 10px;font-size:11.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .hz{display:flex;gap:14px;padding:12px 14px;align-items:flex-start}
        .hz-im{width:92px;height:68px;border-radius:7px;background:#e9e7e1;overflow:hidden;flex:none;display:grid;place-items:center;color:var(--ink3)}
        .hz-im img{width:100%;height:100%;object-fit:cover}
        .hz-b{min-width:0;flex:1}
        .hz-t{font-weight:700;font-size:14px;line-height:1.25}
        .hz-m{font-size:12px;color:var(--ink3);font-weight:500;margin-top:3px}
        .hz-d{font-size:12.5px;color:var(--ink2);line-height:1.45;margin-top:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
        .hz-b .tags{margin-top:8px}
        .bk-c{aspect-ratio:2/3;background:#efece6;position:relative;overflow:hidden}
        .bk-c img{width:100%;height:100%;object-fit:cover;display:block}
        .bk-c::after{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:rgba(24,23,21,.14)}
        .bk-fb{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:14px 12px;background:#f0eee8}
        .bk-fb-t{font-weight:800;font-size:15px;line-height:1.15;text-align:center}
        .bk-fb-a{text-align:center;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);font-weight:700;margin-top:10px}
        .bk-fb::before,.bk-fb::after{content:'';display:block;width:34px;height:1px;background:var(--ink3);margin:14px auto}
        .bk-b{padding:11px 12px 13px}
        .bk-t{font-weight:700;font-size:13px;line-height:1.3}
        .bk-a{font-size:11.5px;color:var(--ink3);font-weight:500;margin-top:3px}
        .bk-r{font-size:11.5px;margin-top:5px;color:var(--ink2)}
        .rd{display:flex;gap:16px;padding:14px 16px}
        .rd-c{width:78px;flex:none;aspect-ratio:2/3;border-radius:5px;overflow:hidden;background:#efece6;position:relative}
        .rd-c img{width:100%;height:100%;object-fit:cover}
        .rd-c::after{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:rgba(24,23,21,.14)}
        .rd-b{min-width:0;flex:1}
        .rd-t{font-weight:700;font-size:14.5px;line-height:1.25}
        .rd-a{font-size:12px;color:var(--ink3);font-weight:500;margin:3px 0 10px}
        .rd-p{font-size:11px;color:var(--ink3);font-weight:700;font-family:var(--mono);margin-top:5px}
        .sh{padding:0 0 10px}
        .sh-c{aspect-ratio:2/3;position:relative;overflow:hidden;background:#efece6}
        .sh-c img{width:100%;height:100%;object-fit:cover}
        .sh-c::after{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:rgba(24,23,21,.14)}
        .sh-t{padding:9px 11px;font-size:11.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-top:3px solid var(--ink)}
        .dev{padding:15px 16px}
        .dev-u{font-family:var(--mono);font-size:11px;color:var(--ink3);display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .dev-t{font-weight:800;font-size:15px;margin-top:7px}
        .dev-d{font-size:12.5px;color:var(--ink2);line-height:1.5;margin-top:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
        .dev-s{display:flex;align-items:center;gap:14px;font-size:12px;font-weight:700;color:var(--ink2);margin:10px 0 0;flex-wrap:wrap}
        .dev-s .lg{display:inline-flex;align-items:center;gap:6px}
        .dev-s .dot{width:8px;height:8px;border-radius:50%;background:var(--fav)}
        .dev .tags{margin-top:10px}
        .fl{display:flex;gap:13px;padding:13px 15px;align-items:center}
        .fl-ic{width:44px;height:44px;border:1px solid var(--line);border-radius:9px;display:grid;place-items:center;color:var(--ink2);flex:none;background:var(--bg)}
        .fl-b{min-width:0;flex:1}
        .fl-n{font-family:var(--mono);font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .fl-m{font-size:11.5px;color:var(--ink3);font-weight:500;margin-top:3px}
        .fl-b .tags{margin-top:8px}
        .cp{display:flex;align-items:center;gap:9px;padding:7px 12px;font-size:12.5px}
        .cp-i{width:26px;height:20px;border-radius:4px;object-fit:cover;flex:none;background:#e9e7e1}
        .cp-ic{color:var(--ink3);flex:none;width:15px;display:grid;place-items:center}
        .cp-t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
        .cp-m{margin-left:auto;color:var(--ink3);font-weight:700;font-size:11px;flex:none}
        .cp .tags{gap:4px;margin-left:8px;flex:none}
        .mg{display:flex;gap:18px;padding:16px 18px;align-items:center}
        .mg-b{flex:1;min-width:0}
        .mg-k{font-size:10px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3)}
        .mg-t{font-weight:800;font-size:18px;line-height:1.15;margin-top:6px;letter-spacing:-.01em}
        .mg-d{font-size:12.5px;color:var(--ink2);line-height:1.55;margin-top:8px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
        .mg-b .tags{margin-top:11px}
        .mg-i{width:150px;height:112px;border-radius:6px;overflow:hidden;flex:none;background:#e9e7e1}
        .mg-i img{width:100%;height:100%;object-fit:cover}
        .dt-i{aspect-ratio:16/9;background:#e9e7e1;overflow:hidden}
        .dt-i img{width:100%;height:100%;object-fit:cover;display:block}
        .dt-b{padding:13px 15px 15px}
        .dt-t{font-weight:800;font-size:14.5px;line-height:1.25}
        .dt-k{font-size:11.5px;color:var(--ink3);font-weight:500;margin-top:4px}
        .dt-d{font-size:12.5px;color:var(--ink2);line-height:1.5;margin-top:8px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
        .dt-f{display:flex;align-items:center;gap:10px;margin-top:11px;flex-wrap:wrap}
        .mt{padding:15px 16px}
        .mt-t{font-weight:800;font-size:14px}
        .mt-g{margin-top:11px;display:grid;gap:5px}
        .mt-r{display:flex;justify-content:space-between;gap:10px;font-size:11.5px}
        .mt-k{color:var(--ink3);font-weight:700;flex:none}
        .mt-v{font-family:var(--mono);font-weight:600;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .mt .tags{margin-top:11px}
        .nt{padding:13px 15px;background:linear-gradient(180deg,#fdfcf6,#fff)}
        .nt-h{display:flex;align-items:center;gap:6px;color:var(--ink3);font-size:11px;font-weight:700}
        .nt-t{font-weight:800;font-size:14.5px;margin-top:7px;line-height:1.3}
        .nt-c{font-size:12.5px;color:var(--ink2);line-height:1.65;margin-top:6px;white-space:pre-line;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
        .nt-f{margin-top:10px}
        .ph-i{aspect-ratio:4/3;background:#e9e7e1;overflow:hidden}

    function itemsInCollection(cid){const fids=collFolderIds(cid);return DB.items.filter(i=>!i.deleted&&!i.archived&&(i.collections.includes(cid)||i.folders.some(x=>fids.has(x))))}
    function baseItems(r){
      const A=DB.items;
      switch(r.ctx){
        case 'all':return A.filter(i=>!i.deleted&&!i.archived);
        case 'favorites':return A.filter(i=>!i.deleted&&!i.archived&&i.favorite);
        case 'pinned':return A.filter(i=>!i.deleted&&!i.archived&&i.pinned);
        case 'recent':return A.filter(i=>!i.deleted&&!i.archived&&i.lastOpened);
        case 'folder':return A.filter(i=>!i.deleted&&!i.archived&&i.folders.includes(r.id));
        case 'collection':{const c=DB.collections.find(c=>c.id===r.id);if(!c)return[];return c.smart?A.filter(i=>smartMatch(c,i)):itemsInCollection(c.id)}
        case 'tag':return A.filter(i=>!i.deleted&&!i.archived&&i.tags.includes(r.tag));
        case 'archive':return A.filter(i=>i.archived&&!i.deleted);
        case 'trash':return A.filter(i=>i.deleted);
        default:return A.filter(i=>!i.deleted&&!i.archived);
      }
    }
    function matchFilters(it){
      const F=S.filters;
      if(F.types.length&&!F.types.includes(it.type))return false;
      if(F.tags.length&&!F.tags.every(t=>it.tags.includes(t)))return false;
      if(F.fav&&!it.favorite)return false;
      if(F.pin&&!it.pinned)return false;
      if(F.rating&&(+(it.metadata?.rating)||0)<F.rating)return false;
      if(F.status&&(it.metadata?.status||'')!==F.status)return false;
      return true;
    }
    function parseQuery(s){
      const q={text:'',type:null,tag:null,author:null,fav:null,pin:null,year:null};
      let rest=' '+s+' ';
      const rx=/\s(\w+):(?:"([^"]+)"|([^\s"]+))/g;let m;
      while((m=rx.exec(' '+s+' '))){
        const k=m[1].toLowerCase(),v=(m[2]!==undefined?m[2]:m[3]).trim();
        if(['type','tag','author','favorite','fav','pinned','pin','year'].includes(k)){
          rest=rest.replace(m[0],' ');
          if(k==='type')q.type=v.toLowerCase();else if(k==='tag')q.tag=v.toLowerCase();
          else if(k==='author')q.author=v.toLowerCase();else if(k==='fav'||k==='favorite')q.fav=v.toLowerCase()==='true';
          else if(k==='pinned'||k==='pin')q.pin=v.toLowerCase()==='true';else if(k==='year')q.year=v;
        }
      }
      q.text=rest.replace(/\s+/g,' ').trim().toLowerCase();return q;
    }
    function matchQuery(it,q){
      if(q.type&&!(it.type===q.type||typeName(it.type).toLowerCase()===q.type))return false;
      if(q.tag&&!it.tags.some(t=>t.toLowerCase()===q.tag))return false;
      if(q.fav&&!it.favorite)return false;
      if(q.pin&&!it.pinned)return false;
      const m=it.metadata||{};
      if(q.year&&String(m.year||'')!==q.year)return false;
      if(q.author){const who=String(m.author||m.director||m.owner||m.instructor||m.channel||m.host||m.artist||m.authors||'').toLowerCase();if(!who.includes(q.author))return false}
      if(q.text){const hay=[it.title,it.description,it.notes,it.url,...(it.tags||[]),...Object.values(m).map(v=>typeof v==='object'?(v&&v.name)||'':String(v))].join(' ').toLowerCase();if(!hay.includes(q.text))return false}
      return true;
    }
    const SORTS={added:(a,b)=>b.createdAt-a.createdAt,updated:(a,b)=>b.updatedAt-a.updatedAt,opened:(a,b)=>(b.lastOpened||0)-(a.lastOpened||0),title:(a,b)=>a.title.localeCompare(b.title),rating:(a,b)=>(+(b.metadata?.rating)||0)-(+(a.metadata?.rating)||0),progress:(a,b)=>(+(b.metadata?.progress)||0)-(+(a.metadata?.progress)||0)};
    const SORT_NAMES={added:'Recently added',updated:'Recently updated',opened:'Recently opened',title:'Alphabetical',rating:'Rating',progress:'Progress'};
    function routeItems(){
      let items=baseItems(S.route).filter(matchFilters);
      if(S.search){const q=parseQuery(S.search);items=items.filter(i=>matchQuery(i,q))}
      return items;
    }
    function vkey(){const r=S.route;return r.ctx+(r.id?':'+r.id:'')+(r.tag?':'+r.tag:'')}
    function getVS(){

    }
    
    /* ============ RENDER ============ */
    function folderChildren(id){return DB.folders.filter(f=>f.parent===(id||null))}
    function countFolder(id){return DB.items.filter(i=>!i.deleted&&!i.archived&&i.folders.includes(id)).length}
    function countCol(c){return c.smart?DB.items.filter(i=>smartMatch(c,i)).length:itemsInCollection(c.id).length}
    function tagCount(t){return DB.items.filter(i=>!i.deleted&&i.tags.includes(t)).length}
    function sbRow(o){

        ${o.chev!=null?`<span class="chev" data-act="fopen" data-id="${o.id}">${ic('chevD',13)}</span>`:''}
        ${fdIcon(o.icon,'folder')}<span class="n">${esc(o.label)}</span>

      ${secHTML('col','Collections — contain folders',cols+`<div class="sb-add" data-act="new-col">${ic('plus',13)} New collection</div><div class="sb-add" data-act="new-smark">${ic('spark',13)} New smart collection</div>`)}

    /* ============ QURAN ============ */
    const JUZ=[1,22,42,62,82,102,121,142,162,182,201,222,242,262,282,302,322,342,362,382,402,422,442,462,482,502,522,542,562,582,605];
    const juzOf=page=>Math.max(0,JUZ.findIndex((p,i)=>page>=p&&page<(JUZ[i+1]||605)));
    function quranStats(){
      const Q=DB.quran;
      const todayStr=new Date().toDateString();
      const today=Q.logs.filter(l=>new Date(l.t).toDateString()===todayStr).reduce((a,l)=>a+Math.max(0,l.to-l.from),0);
      const dset=new Set(Q.logs.map(l=>new Date(l.t).toDateString()));
      let streak=0,d=new Date();
      if(!dset.has(d.toDateString()))d=new Date(Date.now()-DAY);
      while(dset.has(d.toDateString())){streak++;d=new Date(d-DAY)}
      const week=Q.logs.filter(l=>Date.now()-l.t<7*DAY).reduce((a,l)=>a+Math.max(0,l.to-l.from),0);
      const first=Q.logs.length?Math.min(...Q.logs.map(l=>l.t)):now();
      const days=Math.max(1,Math.ceil((Date.now()-first)/DAY));
      const avg=Q.logs.reduce((a,l)=>a+Math.max(0,l.to-l.from),0)/days;
      return {today,streak,week,avg};
    }

    function bookStats(it){
      const s=[...(it.sessions||[])].sort((a,b)=>a.t-b.t);
      const pages=+it.metadata?.pages||0;
      const pos=s.length?Math.max(...s.map(x=>x.to)):Math.round((it.metadata?.progress||0)/100*pages);
      const total=s.reduce((a,x)=>a+Math.max(0,x.to-x.from),0);
      const days=s.length?Math.max(1,Math.ceil((Date.now()-s[0].t)/DAY)):1;
      const avg=total/days;
      const dset=new Set(s.map(x=>new Date(x.t).toDateString()));
      let streak=0,d=new Date();
      if(!dset.has(d.toDateString()))d=new Date(Date.now()-DAY);
      while(dset.has(d.toDateString())){streak++;d=new Date(d-DAY)}
      const left=pages?Math.max(0,pages-pos):0;
      const eta=avg>0&&left>0?Math.ceil(left/avg):null;
      return {pos,pages,total,avg,streak,left,eta};
    }

    function fval(fd,it){
      let v=it.metadata?.[fd.k];if(v==null||v==='')return null;
      switch(fd.t){
        case 'url':return `<a class="dlink" href="${esc(v)}" target="_blank" rel="noopener">${esc(v)}</a>`;
        case 'rating':return `<span class="rt">★ ${esc(v)}</span>`;
        case 'progress':return `<span style="display:flex;align-items:center;gap:10px"><span class="bar w120"><i style="width:${v}%"></i></span><span class="pv">${v}%</span></span>`;
        case 'boolean':return v?'Yes':'No';
        case 'image':return v.startsWith('http')||v.startsWith('data:')?`<img class="dimg" src="${esc(v)}" alt="">`:null;
        case 'file':return `<span class="mono" style="font-size:12px">${esc(v.name||String(v))}${v.size?` · ${esc(v.size)}`:''}</span>`;
        case 'select':return STCOL[v]?stChip(v):`<span class="st">${esc(v)}</span>`;
        case 'date':return fmtDate(v);
        default:return esc(typeof v==='object'?JSON.stringify(v):v);
      }
    }
    function md(s){
      s=esc(s||'');
      s=s.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
      const lines=s.split('\n');let out='',list=false;
      for(const ln of lines){
        if(/^- /.test(ln)){if(!list){out+='<ul>';list=true}out+='<li>'+ln.slice(2)+'</li>'}
        else{if(list){out+='</ul>';list=false}
          if(/^## /.test(ln))out+='<h5>'+ln.slice(3)+'</h5>';
          else if(ln.trim())out+='<p>'+ln+'</p>'}
      }
      if(list)out+='</ul>';return out;
    }

    function autoTitle(u){
      if(!u)return '';
      try{
        const U=new URL(u.includes('://')?u:'https://'+u);
        const host=U.hostname.replace(/^www\./,'');
        const seg=U.pathname.split('/').filter(Boolean).pop()||'';
        let t=seg?seg.replace(/\.(html?|php|aspx?)$/i,'').replace(/[-_]+/g,' '):host;
        t=t.replace(/\b\w/g,c=>c.toUpperCase()).trim();
        return (t||host).slice(0,80);
      }catch(e){return ''}
    }
    function fieldInput(fd,v){

        case 'number':return `<input type="number" step="any" name="${n}" value="${esc(v??'')}">`;
        case 'url':return `<input type="url" name="${n}" value="${esc(v??'')}" placeholder="https://…">`;
        case 'date':return `<input type="date" name="${n}" value="${esc(v??'')}">`;
        case 'select':return `<select name="${n}"><option value=""></option>${(fd.opts||[]).map(o=>`<option ${String(v)===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`;

        case 'color':return `<input type="color" name="${n}" value="${esc(v||'#cccccc')}" style="height:36px;padding:3px">`;

          return `<div class="upl">${src?`<img class="imgpv" src="${esc(src)}" alt="">`:''}<button type="button" class="btn sm" data-act="pick-img" data-k="${fd.k}">${src?'Replace image':'Upload image'}</button>${src?`<button type="button" class="mini" data-act="clr-img" data-k="${fd.k}">${ic('x',13)}</button>`:''}<span class="hint" style="margin:0">or paste a URL:</span><input type="url" name="${n}" value="${typeof v==='string'&&!v.startsWith('data:')?esc(v):''}" placeholder="https://…" style="flex:1;min-width:140px"></div>`}
        case 'file':{const fv=S.form.files[fd.k];

      return '';

    function previewFromForm(){

    function tplOrder(type){
      const ids=[TYPE_TPL[type]||'detailed','minimal','detailed','horizontal','note','linkcard','post','photo','landscape','audio','poster','book','magazine','minimalImage','compact','dev','file','reading','cinematic','hero','shelf','thumbGrid','metadata'];
      const seen=new Set(),out=[];
      for(const id of ids){const t=getTemplate(id);if(t&&!seen.has(t.id)){seen.add(t.id);out.push(t)}}
      allTemplates().forEach(t=>{if(!seen.has(t.id)){seen.add(t.id);out.push(t)}});
      return out;

    /* ---- the mock strip: each template renders at FULL natural size, then scales to fit its tile ---- */
    function tplStripHtml(){
      const pv=previewFromForm(),g=G(pv);

        const tp=getTemplate(t.id);
        const tw=tp.w||240;
        return `<button type="button" class="tpTile ${S.form.tpl===t.id?'on':''}" data-act="form-tpl" data-v="${t.id}" title="${esc(t.name)}">

    /* measure each mock and scale-to-fit + center it inside its tile viewport */
    function layoutMocks(){
      $$('.tpMock').forEach(box=>{
        const c=box.querySelector('.tpCard');
        if(!c)return;
        c.style.transform='';c.style.left='0px';c.style.top='0px';
        const bw=box.clientWidth,bh=box.clientHeight;
        if(!bw||!bh)return;
        const cw=c.offsetWidth,ch=c.offsetHeight;
        if(!cw||!ch)return;
        const s=Math.min(bw/cw,bh/ch);
        c.style.transform=`scale(${s})`;
        c.style.left=Math.max(0,(bw-cw*s)/2)+'px';
        c.style.top=Math.max(0,(bh-ch*s)/2)+'px';
      });
    }
    function folderOptsGrouped(sel2){

    function applyFetched(url,res){
      stashForm();
      const C=S.form.carryAll||(S.form.carryAll={});
      C.link=url;
      const dom=hostOf(url),plat=platformName(dom);
      if(!res){
        const live=!!embedFrame(url,dom);
        if(!S.form.editId){
          if(/facebook|instagram|twitter|x\.com|threads|reddit|linkedin/.test(dom)){S.form.type='post';S.form.tpl='post'}
          else if(/youtu\.?be/.test(dom)){S.form.type='video';S.form.tpl='landscape'}
        }
        S.form.fetched={provider:plat,fail:true,live};
        S.form.titleDirty=true;
        renderModalStep();
        return;
      }
      if(res.title&&!String(C.title||'').trim())C.title=res.title;
      if(res.desc&&!String(C.desc||'').trim())C.desc=res.desc;
      const oldType=S.form.type;
      const sug=suggestType(res.dom,res.otype);
      if(!S.form.editId&&sug&&sug!==S.form.type){S.form.type=sug;S.form.tpl=TYPE_TPL[sug]||'detailed'}
      const map={author:res.author,channel:res.author,host:res.author,creator:res.author,instructor:res.author,owner:res.owner||res.author,artist:res.author,director:res.author,publisher:res.provider||plat,site:res.provider||plat,platform:res.provider||plat,source:res.provider||plat,venue:res.provider};
      typeDef(S.form.type).fields.forEach(fd=>{
        const key='m_'+fd.k;
        if(C[key]&&String(C[key]).trim())return;
        if(fd.t==='url'){C[key]=url;return}
        if(map[fd.k])C[key]=map[fd.k];
      });
      if(res.image)S.form.imgs.__thumb=res.image;
      S.form.titleDirty=true;
      let n=1;if(res.title)n++;if(res.desc)n++;if(res.image)n++;if(res.author)n++;
      S.form.fetched={provider:res.provider||plat,fields:n,typeSw:S.form.type!==oldType?typeName(S.form.type):''};
      renderModalStep();
    }
    function readForm(){
      const m=$('.modal.addm');if(!m)return null;
      const F=S.form,d=typeDef(F.type);
      const V=n=>m.querySelector(`[name="${n}"]`);
      const link=(V('link')?.value.trim())||'';
      let title=(V('title')?.value.trim())||'';
      if(!title)title=autoTitle(link)||'Untitled';
      const prim=d.fields.find(fd=>fd.k==='content');
      for(const fd of d.fields){
        if(!fd.req)continue;
        const e=V('m_'+fd.k);
        const v=e?(e.type==='checkbox'?e.checked:e.value.trim?e.value.trim():e.value):'';
        if(!v&&(F.advOpen||fd===prim)){toast(`“${fd.l}” is required.`);return null}
      }
      const it=F.editId?DB.items.find(i=>i.id===F.editId):newBaseItem({});
      it.title=title;it.type=F.type;it.url=link;
      it.description=V('desc')?.value.trim()||'';
      it.notes=V('notes')?.value.trim()||'';
      it.favorite=!!V('ffav')?.checked;it.pinned=!!V('fpin')?.checked;
      it.tags=[...F.tags];it.collections=[...F.cols];it.folders=V('folder')?.value?[V('folder').value]:[];
      it.tpl=F.tpl;
      if(S.form.imgs.__thumb)it.thumb=S.form.imgs.__thumb;
      else if(!F.editId)it.thumb='';
      const md={...(it.metadata||{})};
      if(d.fields.some(fd=>fd.k==='url'&&fd.t==='url'))md.url=link;
      d.fields.forEach(fd=>{
        if(fd.k==='url'&&fd.t==='url')return;
        const e=V('m_'+fd.k);if(!e)return;
        if(fd.t==='image'){const u=e.value.trim();const local=S.form.imgs[fd.k];md[fd.k]=local||u||'';if(md[fd.k])it.thumb=md[fd.k]}
        else if(fd.t==='file'){if(S.form.files[fd.k])md[fd.k]=S.form.files[fd.k]}
        else if(fd.t==='boolean')md[fd.k]=e.checked;
        else if(fd.t==='progress')md[fd.k]=+e.value||0;
        else if(fd.t==='number'){const v=e.value.trim();md[fd.k]=v===''?'':+v}
        else md[fd.k]=e.value.trim();
      });
      it.metadata=md;it.updatedAt=now();
      return it;
    }

      return DB.items.find(i=>i.id!==it.id&&!i.deleted&&i.url&&norm(i.url)===norm(it.url));

    function openPalette(){
      closePalette();
      const w=el('pal-w',`<div class="pal"><div class="pal-in">${ic('search',17)}<input id="pq" placeholder="Search items, or a command…  type:movie  tag:scifi  favorite:true" autofocus></div><div class="pal-r" id="palR"></div><div class="pal-f"><span>↑↓ navigate</span><span>↵ open</span><span>esc close</span><span style="margin-left:auto">type: · tag: · author: · year: · favorite:</span></div></div>`);
      $('#ovl').appendChild(w);S.pal={sel:0};
      const inp=w.querySelector('#pq');
      const draw=()=>{
        const v=inp.value,ql=v.toLowerCase();
        const cmds=CMDS.filter(c=>c.n.toLowerCase().includes(ql)).slice(0,6);
        let items=[];
        if(v.trim()){const q=parseQuery(v);items=DB.items.filter(i=>!i.deleted&&matchQuery(i,q)).sort((a,b)=>b.updatedAt-a.updatedAt).slice(0,8)}
        S.pal.cmds=cmds;S.pal.items=items;
        S.pal.sel=Math.max(0,Math.min(S.pal.sel,cmds.length+items.length-1));
        const total=cmds.length+items.length;
        const rows=[cmds.length?`<div class="pal-sec">Commands</div>`:''].concat(cmds.map((c,i)=>`<div class="pal-i ${S.pal.sel===i?'sel':''}" data-pal="${i}"><span class="pi">${ic(c.icon,14)}</span><b>${esc(c.n)}</b></div>`))
          .concat(items.length?['<div class="pal-sec">Items</div>']:[])
          .concat(items.map((it,i)=>{const g=G(it);return `<div class="pal-i ${S.pal.sel===cmds.length+i?'sel':''}" data-pal="${cmds.length+i}">${g.img?`<img src="${esc(g.img)}" alt="">`:`<span class="pi">${ic(g.icon,13)}</span>`}<b>${esc(it.title)}</b><span>${esc(g.type)}</span></div>`}));
        $('#palR').innerHTML=total?rows.join(''):'<div class="pal-e">Nothing found — try a different search, or Ctrl N to add an item.</div>';
      };
      inp.addEventListener('input',()=>{S.pal.sel=0;draw()});
      inp.addEventListener('keydown',e=>{
        const total=(S.pal.cmds?.length||0)+(S.pal.items?.length||0);
        if(e.key==='ArrowDown'){e.preventDefault();S.pal.sel=(S.pal.sel+1)%Math.max(total,1);draw()}
        if(e.key==='ArrowUp'){e.preventDefault();S.pal.sel=(S.pal.sel-1+Math.max(total,1))%Math.max(total,1);draw()}
        if(e.key==='Enter'){e.preventDefault();runPal(S.pal.sel)}
      });
      draw();inp.focus();
    }
    function runPal(idx){

    /* ---------- drag & drop ---------- */
    function fileKind(file){
      const t=file.type,n=file.name.toLowerCase();
      if(t.startsWith('image/'))return 'image';
      if(t.startsWith('video/'))return 'video';
      if(t.startsWith('audio/'))return 'audio';
      if(t==='application/pdf'||n.endsWith('.pdf'))return 'pdf';
      if(/\.(md|txt|doc|docx|rtf)$/.test(n))return 'document';
      return 'file';
    }
    function addFileItem(file){
      const kind=fileKind(file);
      const it=newBaseItem({title:file.name.replace(/\.[^.]+$/,''),type:kind});
      it.metadata.file={name:file.name,size:fmtSize(file.size)};
      DB.items.push(it);saveDB();
      if(kind==='image')imgCompact(file,du=>{it.thumb=du;saveDB();render()});
      return it;
    }
    function toast(msg,act){
      const t=el('toast',`<span>${esc(msg)}</span>`);

    }
    
    /* ============ EVENTS ============ */

          const rel=e.target.closest('.rel');

      }
      const d=act.dataset,id=d.id||'';

      switch(d.act){
        case 'nav':
          if(d.ctx==='settings'){openSettings();break}

          const m=act.closest('.modal');

          act.innerHTML='<span class="spin"></span> Fetching';

          const isNew=!DB.items.some(x=>x.id===it.id);
          if(isNew)DB.items.push(it);
          it.tags.forEach(t=>{if(!DB.tags.some(x=>x.name===t))DB.tags.push({name:t})});

        case 'ftag':{const F=S.filters,i=F.tags.indexOf(d.v);i>-1?F.tags.splice(i,1):F.tags.push(d.v);if(POP&&POP.contains(act))act.classList.toggle('on');renderMain();break}

        case 'rel-pick':{const src=DB.items.find(i=>i.id===d.src);src.relations.push(id);const tgt=DB.items.find(i=>i.id===id);if(!tgt.relations.includes(src.id))tgt.relations.push(src.id);saveDB();closeModal(act.closest('.modal'));refresh();toast('Items related.');break}
        case 'rel-remove':{const src=DB.items.find(i=>i.id===S.detail);src.relations=src.relations.filter(x=>x!==id);const tgt=DB.items.find(i=>i.id===id);if(tgt)tgt.relations=tgt.relations.filter(x=>x!==src.id);saveDB();refresh();break}

        case 'book-log':{
          const it=item();
          let from=+($('#bsFrom')?.value||0),to=+($('#bsTo')?.value||0);
          if(!(from>=1&&to>0&&to!==from)){toast('Check the page numbers — “to” must differ from “from”.');break}
          if(to<from)[from,to]=[to,from];
          const pages=+it.metadata?.pages||0;
          if(pages){to=Math.min(to,pages);from=Math.min(from,to)}
          it.sessions??=[];it.sessions.push({t:now(),from,to});
          if(pages)it.metadata.progress=Math.min(100,Math.round(to/pages*100));
          if(!it.metadata.status||it.metadata.status==='Unread')it.metadata.status='Reading';
          if(pages&&to>=pages){it.metadata.status='Finished';it.metadata.progress=100}

          toast(`Logged ${to-from} pages${pages?` — ${Math.round(to/pages*100)}% done`:''}`);

          const it=newBaseItem({type:'note',title:first.slice(0,70),metadata:{content:c.text},folders:fid?[fid]:[]});
          DB.items.push(it);saveDB();render();
          toast(`Saved as note${fid?' in “'+(DB.folders.find(x=>x.id===fid)?.name||'')+'”':''}`,{label:'Open',fn:()=>openItem(it.id)});
          break}
        case 'clip-book':{
          const c=DB.clipboard.find(x=>x.id===id);if(!c)break;
          const fid=$(`#cf_${id}`)?.value||'';
          const url=c.text.trim();
          const g={domain:''};try{g.domain=new URL(url.includes('://')?url:'https://'+url).hostname.replace(/^www\./,'')}catch(_){}
          const it=newBaseItem({type:'link',title:autoTitle(url)||url.slice(0,70),url,metadata:g.domain?{site:g.domain}:{},folders:fid?[fid]:[]});
          DB.items.push(it);saveDB();render();
          toast(`Saved as bookmark${fid?' in “'+(DB.folders.find(x=>x.id===fid)?.name||'')+'”':''}`,{label:'Open',fn:()=>openItem(it.id)});
          break}
        case 'clip-fetch':{
          const c=DB.clipboard.find(x=>x.id===id);if(!c)break;
          const url=c.text.trim();
          toast('Fetching from the internet…');
          fetchEmbed(url).then(res=>{
            const dom=hostOf(url),plat=platformName(dom);
            const sug=res?suggestType(res.dom,res.otype):(/facebook|instagram|twitter|x\.com|reddit|threads/.test(dom)?'post':'link');
            const it=newBaseItem({type:sug,url,tpl:TYPE_TPL[sug]||'detailed'});
            if(res){
              it.title=res.title||autoTitle(url)||url.slice(0,70);
              it.description=res.desc||'';
              it.thumb=res.image||'';
              const map={author:res.author,channel:res.author,host:res.author,creator:res.author,instructor:res.author,owner:res.owner||res.author,artist:res.author,director:res.author,publisher:res.provider||plat,site:res.provider||plat,platform:res.provider||plat,source:res.provider||plat,venue:res.provider};
              typeDef(sug).fields.forEach(fd=>{if(fd.t!=='url'&&map[fd.k])it.metadata[fd.k]=map[fd.k]});
            }else{
              it.title=autoTitle(url)||plat+' — '+url.slice(0,50);
            }
            DB.items.push(it);saveDB();render();
            toast(`Fetched & saved from ${plat}`,{label:'Open',fn:()=>openItem(it.id)});
          });
          break}
        case 'q-start':DB.quran.khatms.push({id:uid(),start:now(),page:0});saveDB();render();toast('بدأت ختمة جديدة — بالتوفيق');break;
        case 'q-log':{
          const Q=DB.quran;const active=Q.khatms.find(k=>!k.finished);
          if(!active){toast('ابدأ ختمة أولاً — start a khatm first.');break}
          let from=+($('#qwFrom')?.value||0),to=+($('#qwTo')?.value||0);
          if(!(from>=1&&to>from)){toast('راجع أرقام الصفحات — «إلى» لازم أكبر من «من».');break}
          let carry=0;
          if(to>604){carry=to-604;to=604}
          Q.logs.push({t:now(),from,to,kid:active.id});
          active.page=to;
          if(to>=604){
            active.finished=now();
            Q.khatms.push({id:uid(),start:now(),page:carry});
            toast(carry>0?`ختمة مكتملة ما شاء الله — بدأت التالية من صفحة ${carry}`:'ختمة مكتملة ما شاء الله — بدأت ختمة جديدة');
          }else toast(`تم تسجيل الورد — ${to-from} صفحة`);
          saveDB();renderMain();renderSidebar();break}
        case 'q-del-log':{const Q=DB.quran;Q.logs=Q.logs.filter(l=>l.t!==+d.t);
          Q.khatms.forEach(k=>{if(k.finished)return;const mx=Math.max(0,...Q.logs.filter(l=>l.kid===k.id).map(l=>l.to),0);k.page=mx});
          saveDB();renderMain();break}
        case 'icp':{const wrap=act.closest('.icpick');wrap.querySelector('[name=ic]').value=d.ic;wrap.querySelectorAll('.icp').forEach(b=>b.classList.toggle('on',b.dataset.ic===d.ic));break}
        case 'new-folder':folderModal();break;
        case 'col-add-folder':folderModal(null,null,id);break;
        case 'save-folder':{const m=act.closest('.modal'),n=m.querySelector('[name=n]').value.trim();
          if(!n){toast('Give the folder a name.');break}
          const ico=m.querySelector('[name=ic]')?.value.trim()||'';
          const coll=m.querySelector('[name=c]').value||null;
          const p=m.querySelector('[name=p]').value||null;
          if(id&&p&&isDesc(p,id)){toast("A folder can't go inside its own subfolder.");break}
          if(id)Object.assign(DB.folders.find(x=>x.id===id),{name:n,parent:p,coll,icon:ico||null});
          else DB.folders.push({id:uid(),name:n,parent:p,coll,icon:ico||null,open:true});
          saveDB();closeModal(m);render();toast('Folder saved');break}
        case 'fopen':{e.stopPropagation();const fd=DB.folders.find(x=>x.id===id);fd.open=!fd.open;saveDB();renderSidebar();break}
        case 'fmenu':{e.stopPropagation();openCtx(e.clientX,e.clientY,`
          <button class="po-i" data-act="edit-folder" data-id="${id}">${ic('edit',14)} Rename / move / icon</button>
          <button class="po-i" data-act="new-subfolder" data-id="${id}">${ic('plus',14)} New subfolder</button>
          <button class="po-i" style="color:var(--danger)" data-act="delete-folder" data-id="${id}">${ic('trash',14)} Delete folder</button>`);break}
        case 'edit-folder':folderModal(id);break;
        case 'new-subfolder':folderModal(null,id);break;
        case 'delete-folder':{const fd=DB.folders.find(x=>x.id===id);
          confirmModal('Delete folder',`“<b>${esc(fd.name)}</b>” will be removed. Items inside stay in your library — only the folder goes.`,'danger',()=>{
            DB.folders=DB.folders.filter(x=>x.id!==id&&x.parent!==id);
            DB.items.forEach(i=>i.folders=i.folders.filter(fid=>fid!==id));
            if(S.route.ctx==='folder'&&S.route.id===id)S.route={ctx:'all'};
            saveDB();closePopover();render()});break}
        case 'new-col':colModal();break;
        case 'save-col':{const m=act.closest('.modal'),n=m.querySelector('[name=n]').value.trim();
          if(!n){toast('Give the collection a name.');break}
          const ico=m.querySelector('[name=ic]')?.value.trim()||'';
          if(id)Object.assign(DB.collections.find(c=>c.id===id),{name:n,icon:ico||null});
          else DB.collections.push({id:uid(),name:n,icon:ico||null});
          saveDB();closeModal(m);render();toast('Collection saved');break}
        case 'colmenu':{e.stopPropagation();
          openCtx(e.clientX,e.clientY,`
          <button class="po-i" data-act="col-add-folder" data-id="${id}">${ic('plus',14)} Add folder inside</button>
          <button class="po-i" data-act="edit-col" data-id="${id}">${ic('edit',14)} Rename / icon</button>
          <button class="po-i" style="color:var(--danger)" data-act="delete-col" data-id="${id}">${ic('trash',14)} Delete collection</button>`);break}
        case 'edit-col':colModal(id);break;
        case 'delete-col':{const c=DB.collections.find(x=>x.id===id);
          confirmModal('Delete collection',`“<b>${esc(c.name)}</b>” will be removed. Folders and items stay in the library.`,'danger',()=>{
            DB.collections=DB.collections.filter(x=>x.id!==id);
            DB.folders.forEach(fd=>{if(fd.coll===id)fd.coll=null});
            DB.items.forEach(i=>i.collections=i.collections.filter(cid=>cid!==id));
            if(S.route.ctx==='collection'&&S.route.id===id)S.route={ctx:'all'};
            saveDB();closePopover();render()});break}
        case 'new-smart':case 'new-smark':smartModal();break;
        case 'sc-type':{const m=act.closest('.modal'),v=d.v;const i=m._types.indexOf(v);i>-1?m._types.splice(i,1):m._types.push(v);act.classList.toggle('on');break}
        case 'save-smart':{const m=act.closest('.modal'),n=m.querySelector('[name=n]').value.trim();
          if(!n){toast('Give it a name.');break}
          const tg=m.querySelector('[name=tg]').value.trim();
          DB.collections.push({id:uid(),name:n,smart:{types:m._types||[],tags:tg?[tg]:[],favorite:m.querySelector('[name=fv]').checked}});
          saveDB();closeModal(m);render();toast('Smart collection created — it updates itself.');break}
        case 'new-type':typeModal();break;
        case 'save-type':{const m=act.closest('.modal'),n=m.querySelector('[name=n]').value.trim();
          if(!n){toast('Name your type.');break}
          const fields=window._tf.filter(fd=>fd.l&&fd.l.trim()).map(fd=>({k:fd.l.trim().toLowerCase().replace(/[^a-z0-9]+/g,'_'),l:fd.l.trim(),t:fd.t,opts:fd.opts?fd.opts.split(',').map(s=>s.trim()).filter(Boolean):undefined}));
          if(!fields.length){toast('Add at least one field.');break}
          const nid=id||('ct_'+uid());
          if(id)Object.assign(DB.customTypes.find(t=>t.id===id),{name:n,fields});
          else DB.customTypes.push({id:nid,name:n,icon:'bulb',cat:'Custom',fields});
          saveDB();closeModal(m);toast(`Type “${n}” is ready to use.`);
          if(S.form&&S.form.picking){S.form.type=nid;S.form.tpl='detailed';S.form.picking=false;renderModalStep()}
          break}
        case 'tf-add':window._tf.push({k:'',l:'',t:'text',opts:''});act.closest('.modal')._draw();break;
        case 'tf-del':window._tf.splice(+d.i,1);act.closest('.modal')._draw();break;
        case 'tf-up':{const i=+d.i;if(i>0){[window._tf[i-1],window._tf[i]]=[window._tf[i],window._tf[i-1]];act.closest('.modal')._draw()}break}
        case 'edit-type':typeModal(id);break;
        case 'delete-type':{const td=DB.customTypes.find(t=>t.id===id);
          confirmModal('Delete type',`Custom type “<b>${esc(td.name)}</b>” will be removed. Items of this type become generic.`,'danger',()=>{
            DB.customTypes=DB.customTypes.filter(t=>t.id!==id);saveDB();closeModal($('.modal'));render()});break}
        case 'new-tpl':tplModal();break;
        case 'pv-img':{const mm=act.closest('.modal');mm._pvimg=d.v==='1';mm.querySelectorAll('[data-act=pv-img]').forEach(b=>b.classList.toggle('pri',b.dataset.v===d.v));if(mm._prev)mm._prev();break}
        case 'save-tpl':{const m=act.closest('.modal');window._td.name=m.querySelector('[name=n]').value.trim();
          if(!window._td.name){toast('Name your template.');break}
          if(id)Object.assign(DB.customTemplates.find(t=>t.id===id),{name:window._td.name,def:window._td});
          else DB.customTemplates.push({id:'cu:'+uid(),name:window._td.name,def:window._td});
          saveDB();closeModal(m);S.route={ctx:'templates'};render();toast('Template saved — pick it on any item while adding or editing.');break}
        case 'edit-tpl':tplModal(d.tpl);break;
        case 'delete-tpl':{DB.customTemplates=DB.customTemplates.filter(t=>t.id!==d.tpl);saveDB();render();break}
        case 'export':exportLib();break;
        case 'import-btn':importLib();break;
        case 'load-demo':confirmModal('Load sample library','This replaces your current library with the sample content.','danger',()=>{DB=seedDB();saveDB();closeModal($('.modal'));closeItemViewHard();S.route={ctx:'home'};render();toast('Sample library loaded.')});break;
        case 'wipe':confirmModal('Erase everything','Your entire library will be permanently erased from this browser. Export first if you want a copy.','danger',()=>{DB=normDB({});saveDB();closeModal($('.modal'));closeItemViewHard();S.route={ctx:'home'};render();toast('Library erased.')});break;
        case 'tag-view':S.route={ctx:'tag',tag:d.tag};S.search='';render();break;
        case 'edit-tag':{const t=DB.tags.find(x=>x.name===d.tag);
          openModal(`<div class="m-h">${ic('tag',17)}<span class="m-t">Edit tag</span><button class="m-x" data-act="close-modal-x">${ic('x',16)}</button></div>
          <div class="m-b"><div class="fld"><label>Name</label><input name="n" value="${esc(t.name)}"></div>
          <div class="fld"><label>Color</label><input type="color" name="c" value="${t.color||'#2563eb'}" style="height:38px;padding:3px"></div></div>
          <div class="m-f"><button class="btn dgr" data-act="delete-tag" data-tag="${esc(t.name)}">${ic('trash',13)} Delete tag</button><button class="btn pri" data-act="save-tag" data-tag="${esc(t.name)}">Save</button></div>`);break}
        case 'save-tag':{const m=act.closest('.modal'),old=d.tag,t=DB.tags.find(x=>x.name===old);
          const nn=m.querySelector('[name=n]').value.trim();
          t.color=m.querySelector('[name=c]').value;
          if(nn&&nn!==old){t.name=nn;DB.items.forEach(i=>i.tags=i.tags.map(x=>x===old?nn:x))}
          saveDB();closeModal(m);render();break}
        case 'delete-tag':{const tg=d.tag;confirmModal('Delete tag',`#${esc(tg)} will be removed from ${tagCount(tg)} items.`,'danger',()=>{
          DB.tags=DB.tags.filter(t=>t.name!==tg);DB.items.forEach(i=>i.tags=i.tags.filter(t=>t!==tg));
          saveDB();closeModal($('.modal'));render()});break}
      }
    });
    
    document.addEventListener('contextmenu',e=>{
      const c=e.target.closest('.card');
      if(c&&c.dataset.id&&!c.dataset.static&&$('#main').contains(c)){
        e.preventDefault();
        const it=DB.items.find(i=>i.id===c.dataset.id);
        if(it)openCtx(e.clientX,e.clientY,ctxItem(it));
      }
    });
    
    /* live inputs */
    let stripTmr=null;
    function scheduleStrip(){
      clearTimeout(stripTmr);
      stripTmr=setTimeout(()=>{const s=$('#tplStrip');if(s){const sl=s.scrollLeft;s.innerHTML=tplStripHtml();s.scrollLeft=sl;layoutMocks()}},180);
    }
    function liveInput(e){
      const t=e.target;
      if(t.id==='tq'){const v=(t.value||'').toLowerCase();$$('.modal .tt').forEach(b=>b.style.display=(b.dataset.n||'').includes(v)?'':'none');return}
      if(t.dataset&&t.dataset.fb!==undefined&&t.type!=='checkbox'){
        const i=+t.dataset.fbi,key=t.dataset.fb;
        if(window._tf&&window._tf[i])window._tf[i][key]=t.value;
        if(key==='t'){const m=t.closest('.modal');if(m._draw)m._draw()}
        return;
      }
      if(t.dataset&&t.dataset.tb!==undefined&&window._td){Object.assign(window._td,{[t.dataset.tb]:t.value});const m=t.closest('.modal');if(m._prev)m._prev();return}
      if(t.dataset&&t.dataset.tbs!==undefined&&window._td){window._td.show[t.dataset.tbs]=t.checked?1:0;const m=t.closest('.modal');if(m._prev)m._prev();return}
      const m=t.closest&&t.closest('.modal.addm');
      if(m&&S.form&&t.name==='link'){
        if(S.form.fetched){S.form.fetched=null;m.querySelectorAll('.embsuccess,.embfail,.embprev').forEach(x=>x.remove())}
        if(!S.form.titleDirty){const ti=m.querySelector('[name=title]');if(ti)ti.value=autoTitle(t.value)}
        scheduleStrip();
      }
    }
    document.addEventListener('input',liveInput);
    document.addEventListener('change',liveInput);
    
    /* keyboard */
    document.addEventListener('keydown',e=>{
      const ivv=$('.ivwrap');
      if(ivv&&e.key==='ArrowLeft'&&!e.target.closest('input')){ivNav(-1);return}
      if(ivv&&e.key==='ArrowRight'&&!e.target.closest('input')){ivNav(1);return}
      if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$$('.pal-w').length?closePalette():openPalette();return}
      if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='n'){e.preventDefault();openItemModal();return}
      if(e.key==='Escape'){
        if($$('.pal-w').length){closePalette();return}
        if(MODALS.length){closeTopModal();return}
        if(S.detail||$$('.dwrap,.nvwrap,.ivwrap,.bvwrap').length){closeItemView();return}
        closePopover();
        return;
      }
      if(e.key!=='Enter')return;
      if(e.target.id==='embUrl'){
        e.preventDefault();
        if(S.form&&S.form.fetched&&!S.form.fetched.fail){const b=$('.modal.addm [data-act=save-item]');if(b)b.click()}
        else{const b=$('#embBtn');if(b)b.click()}
        return;
      }
      if(e.target.id==='ftag'&&S.form){
        e.preventDefault();
        const v=e.target.value.trim().replace(/^#/,'');
        if(v&&!S.form.tags.includes(v)){
          S.form.tags.push(v);
          const chip=document.createElement('button');chip.type='button';chip.className='chip x';chip.dataset.act='form-tag-rm';chip.dataset.tag=v;chip.textContent=v;
          const st=DB.tags.find(t=>t.name===v);if(st&&st.color){chip.style.background=st.color+'16';chip.style.color=st.color}
          e.target.before(chip);e.target.value='';
        }
        return;
      }
      if(e.target.id==='tagIn'&&S.detail){
        e.preventDefault();const v=e.target.value.trim().replace(/^#/,'');
        if(v){const it=DB.items.find(i=>i.id===S.detail);it.tags.push(v);if(!DB.tags.some(t=>t.name===v))DB.tags.push({name:v});it.updatedAt=now();saveDB();refresh()}
        return;
      }
      if(e.target.closest&&e.target.closest('.pal-i')){runPal(+e.target.closest('.pal-i').dataset.pal);return}
      if(e.target.closest&&e.target.closest('.q-wir')&&e.target.tagName==='INPUT'){e.preventDefault();const b=$('[data-act=q-log]');if(b)b.click();return}
      if(e.target.closest&&e.target.closest('.bv-logrow')&&e.target.tagName==='INPUT'){e.preventDefault();const b=$('[data-act=book-log]');if(b)b.click();return}
      if(e.target.closest&&e.target.closest('.modal.addm')&&e.target.tagName==='INPUT'&&e.target.type!=='color'){
        e.preventDefault();const b=$('.modal.addm [data-act=save-item]');if(b)b.click();
      }
    });
    document.addEventListener('click',e=>{if(e.target.id==='hq')openPalette()});
    
    /* clipboard capture */
    const capCopy=()=>{try{const s=window.getSelection?String(window.getSelection()):'';if(s&&s.trim())addClip(s)}catch(_){}};
    document.addEventListener('copy',capCopy);
    document.addEventListener('cut',capCopy);
    
    /* drag & drop */
    let dragDepth=0,dz=null;
    window.addEventListener('dragenter',e=>{e.preventDefault();if(!dz&&e.dataTransfer?.types?.includes('Files')){dragDepth++;dz=el('dropzone',`<div class="dz-c"><h3>Drop files to add them</h3><p>Images, videos, audio, PDFs and documents — the item type follows the actual file.</p></div>`);$('#ovl').appendChild(dz)}});
    window.addEventListener('dragover',e=>e.preventDefault());
    window.addEventListener('dragleave',e=>{e.preventDefault();if(dragDepth>0)dragDepth--;if(!dragDepth&&dz){dz.remove();dz=null}});
    window.addEventListener('drop',e=>{
      e.preventDefault();dragDepth=0;dz?.remove();dz=null;
      const files=[...(e.dataTransfer?.files||[])];
      if(!files.length)return;
      const added=files.map(addFileItem);
      render();
      toast(`Added ${added.length} item${added.length>1?'s':''} — edit them to add details.`);
    });
    
    /* ---------- boot ---------- */
    DB=loadDB();
    if(!DB){DB=seedDB();saveDB();setTimeout(()=>toast('Sample library loaded — try Fetch with any post link, and press Ctrl K anytime.'),700)}
    else{DB.quran??={khatms:[],logs:[]};DB.clipboard??=[];DB.items.forEach(i=>i.sessions??=[]);saveDB()}
    render();
    /* re-fit mocks once web fonts finish loading (text metrics change) */
    if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>layoutMocks());
</script>
</body>
</html>
