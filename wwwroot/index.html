<head>

    <script>
        window.playPomoSound = function(src, volume) {
            try {
                var a = new Audio(src);
                a.volume = (typeof volume === 'number') ? volume : 0.8;
                a.play().catch(function(e){ console.log("audio play failed", e); });
                setTimeout(function() {
                    a.pause();
                }, 2000);
            } catch(e){ console.log(e); }
        }
    </script>
</head>
<body>
    <div id="app">Loading...</div>
    <div id="blazor-error-ui" style="display:none;position:fixed;bottom:0;width:100%;background:#FFF3CD;color:#856404;padding:8px;font:12px Tajawal;border-top:1px solid #FFE69C;z-index:9999">Blazor error: <span id="blazor-error-msg"></span> <a href="" onclick="location.reload();return false" style="color:#856404">Reload</a> <span style="float:left" onclick="this.parentElement.style.display='none'">×</span></div>
    <script>window.onerror=function(m,s,l,c,e){var d=document.getElementById('blazor-error-msg');if(d)d.textContent=m;var ui=document.getElementById('blazor-error-ui');if(ui)ui.style.display='block';console.error(m,e)};window.addEventListener('unhandledrejection',function(e){window.onerror(e.reason,'',0,0,e.reason)});</script>
    <script src="_framework/blazor.webview.js" autostart="false"></script>
</body>
</html>
