        // WebView/WebView2 userAgent always carries the OS token.
        try { if (/Android/i.test(navigator.userAgent || '')) document.documentElement.classList.add('maui-android'); } catch (e) {}
    </script>

    <script>
        window.pomoFs = {
            enter: function() {
                try {
                    document.documentElement.classList.add('pomo-fullscreen');
                    var el = document.documentElement;
                    if (el.requestFullscreen) { el.requestFullscreen().catch(function(){}); }
                } catch(e){}
            },
            exit: function() {
                try {
                    document.documentElement.classList.remove('pomo-fullscreen');
                    if (document.fullscreenElement && document.exitFullscreen) { document.exitFullscreen().catch(function(){}); }
                } catch(e){}
            },
            isFs: function() { try { return !!document.fullscreenElement; } catch(e){ return false; } },
            wire: function(ref) {
                if (window.__pomoFsWired) return;
                window.__pomoFsWired = true;
                document.addEventListener('fullscreenchange', function() {
                    try {
                        var on = !!document.fullscreenElement;
                        if (!on) document.documentElement.classList.remove('pomo-fullscreen');
                        ref.invokeMethodAsync('OnFsChanged', on);
                    } catch(e){}
                });
                document.addEventListener('keydown', function(e) {
                    try {
                        var t = e.target;
                        var tag = (t && t.tagName) || '';
                        if (/^(INPUT|TEXTAREA|SELECT)$/.test(tag) || (t && t.isContentEditable)) return;
                        if (e.code === 'Space' && document.fullscreenElement) {
                            e.preventDefault();
                            ref.invokeMethodAsync('ToggleTimerFromKey');
                        } else if ((e.code === 'KeyF' || e.key === 'F11') && !document.fullscreenElement) {
                            e.preventDefault();
                            ref.invokeMethodAsync('EnterFullscreenFromKey');
                        }
                    } catch(err){}
                });
            }
        };
        window.playPomoSound = function(src, volume) {
            try {
                var a = new Audio(src);
                a.volume = (typeof volume === 'number') ? volume : 0.8;
                a.play().catch(function(e){ console.log("audio play failed", e); });
                setTimeout(function() {
                    a.pause();
                }, 2000);
            } catch(e){ console.log(e); }
        }
    </script>
</head>

    <script>window.onerror=function(m,s,l,c,e){var d=document.getElementById('blazor-error-msg');if(d)d.textContent=m;var ui=document.getElementById('blazor-error-ui');if(ui)ui.style.display='block';console.error(m,e)};window.addEventListener('unhandledrejection',function(e){window.onerror(e.reason,'',0,0,e.reason)});</script>
    <script src="_framework/blazor.webview.js" autostart="false"></script>
